name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR runs are disposable; a run on main may be applying production
  # migrations and must never be killed halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Postgres integration suite + production build against the LOCAL Supabase
  # stack (Docker): the migrations reference the `auth`/`storage` schemas that
  # only a Supabase Postgres ships, so a plain postgres service is not enough.
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @imovil/web run db:start
      - run: pnpm --filter @imovil/db run test:integration:pg
      - run: pnpm build

  # Migration hygiene: the journal is consistent, `schema.ts` has no change
  # without its generated migration, and migrations already on main are never
  # edited (production has applied them; fix forward with a new one).
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # drizzle.config.ts requires a URL; check/generate never connect.
      POSTGRES_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm --filter @imovil/db exec drizzle-kit check
      - name: Schema changes ship with their migration
        run: |
          pnpm --filter @imovil/db run db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            git status --porcelain packages/db/drizzle
            echo "::error::schema.ts changed without a migration. Run 'pnpm --filter @imovil/db db:generate' and commit packages/db/drizzle."
            exit 1
          fi
      - name: Migrations on main are immutable
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          edited=$(git diff --name-only --diff-filter=MDR "origin/${BASE_REF}...HEAD" -- \
            'packages/db/drizzle/*.sql' 'packages/db/drizzle/meta/*_snapshot.json')
          if [ -n "$edited" ]; then
            echo "$edited"
            echo "::error::Migrations already on ${BASE_REF} were edited, renamed or deleted. Add a new migration instead."
            exit 1
          fi

  # Playwright E2E against the LOCAL Supabase stack, on the production build
  # (playwright.config.ts switches `next dev` → `next build && next start` when
  # CI is set). Browsers are cached per Playwright version; on a hit only the
  # OS dependencies are installed.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @imovil/web run db:start
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @imovil/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @imovil/web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @imovil/web exec playwright install-deps chromium
      - run: pnpm --filter @imovil/web run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  # Production schema rollout. Runs only on main, only after every check above
  # is green, inside the `production` environment (its secret is unreachable
  # from any other branch). Idempotent: with nothing pending it is a no-op, so
  # it runs on every push and Vercel can gate production promotion on it.
  # `always()` matters: a job skipped because a dependency failed reports as
  # "skipped", which Vercel's Deployment Checks treat as passing. Running and
  # failing explicitly turns any red check into a blocked promotion.
  migrate-production:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, supabase, migrations, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Every required check passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A required job did not succeed; production is not migrated and the deploy must not be promoted."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Apply pending migrations
        env:
          # Supabase session pooler (port 5432): IPv4-reachable from runners
          # and supports the migrator's advisory lock (the 6543 transaction
          # pooler does not).
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: pnpm --filter @imovil/db run db:migrate
